spring.application.name=App

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/proyecto_jira}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

app.jwt.secret=${JIRA_JWT_SECRET:CAMBIAME_EN_PRODUCCION_POR_UNA_CLAVE_DE_256_BITS_MINIMO}

app.jwt.expiration-time=900000
app.jwt.refresh-expiration-time=86400000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true